# =============================================================================
# Attention-Aware Timeline - Docker Compose (Development)
# AI service is optional (profile: ai) — saves CPU/RAM during learning tests.
# Start full stack: docker compose --profile ai up
# Lean stack:       docker compose up postgres redis api web
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: aat-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-attention_aware_timeline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aat_user} -d ${POSTGRES_DB:-attention_aware_timeline}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aat-dev-network

  redis:
    image: redis:7-alpine
    container_name: aat-redis-dev
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aat-dev-network

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: development
    container_name: aat-api-dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: development
      DATABASE_ECHO: ${DATABASE_ECHO:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aat_user}:${POSTGRES_PASSWORD:-change_me_strong_password}@postgres:5432/${POSTGRES_DB:-attention_aware_timeline}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-aat_user}:${POSTGRES_PASSWORD:-change_me_strong_password}@postgres:5432/${POSTGRES_DB:-attention_aware_timeline}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - aat-dev-network

  # Heavy (PyTorch) — only when explicitly enabled
  ai:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: infra/docker/ai/Dockerfile
      target: development
    container_name: aat-ai-dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: development
      AI_DEVICE: ${AI_DEVICE:-cpu}
    ports:
      - "${AI_PORT:-8001}:8001"
    volumes:
      - ./apps/ai:/app
      - ai_dev_models:/app/models
      - /app/.venv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aat-dev-network

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      target: development
    container_name: aat-web-dev
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_AI_SERVICE_URL: http://localhost:8001/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/api/v1/ws/learning
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aat-dev-network

  nginx:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    container_name: aat-nginx-dev
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aat-dev-network

volumes:
  postgres_dev_data:
  redis_dev_data:
  ai_dev_models:

networks:
  aat-dev-network:
    driver: bridge
