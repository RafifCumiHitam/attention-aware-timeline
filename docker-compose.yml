# =============================================================================
# Attention-Aware Timeline - Docker Compose (Development)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      POSTGRES_DB: ${POSTGRES_DB:-attention_aware_timeline}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aat_user} -d ${POSTGRES_DB:-attention_aware_timeline}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aat-network

  # ---------------------------------------------------------------------------
  # Redis (caching, rate limiting, session store)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aat-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aat-network

  # ---------------------------------------------------------------------------
  # Backend API (FastAPI)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: development
    container_name: aat-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-aat_user}:${POSTGRES_PASSWORD:-change_me_strong_password}@postgres:5432/${POSTGRES_DB:-attention_aware_timeline}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-aat_user}:${POSTGRES_PASSWORD:-change_me_strong_password}@postgres:5432/${POSTGRES_DB:-attention_aware_timeline}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aat-network

  # ---------------------------------------------------------------------------
  # AI Service
  # ---------------------------------------------------------------------------
  ai:
    build:
      context: .
      dockerfile: infra/docker/ai/Dockerfile
      target: development
    container_name: aat-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AI_DEVICE: ${AI_DEVICE:-cpu}
    ports:
      - "${AI_PORT:-8001}:8001"
    volumes:
      - ./apps/ai:/app
      - ai_models:/app/models
      - /app/.venv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - aat-network
    # Uncomment for GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      target: development
    container_name: aat-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_AI_SERVICE_URL: http://localhost:8001/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
      - ai
    networks:
      - aat-network

  # ---------------------------------------------------------------------------
  # Nginx (optional reverse proxy for production-like local setup)
  # ---------------------------------------------------------------------------
  # nginx:
  #   image: nginx:1.27-alpine
  #   container_name: aat-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - web
  #     - api
  #     - ai
  #   networks:
  #     - aat-network

volumes:
  postgres_data:
  redis_data:
  ai_models:

networks:
  aat-network:
    driver: bridge
