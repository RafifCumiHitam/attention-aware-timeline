# =============================================================================
# Attention-Aware Timeline - Docker Compose (Production)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database (Production)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aat-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - aat-prod-network

  # ---------------------------------------------------------------------------
  # Redis Cache & Session Store (Production)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aat-redis-prod
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aat-prod-network

  # ---------------------------------------------------------------------------
  # Backend API (FastAPI Production - Multi-worker)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: production
    container_name: aat-api-prod
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aat-prod-network

  # ---------------------------------------------------------------------------
  # AI Service (FastAPI Production - PyTorch Runtime)
  # ---------------------------------------------------------------------------
  ai:
    build:
      context: .
      dockerfile: infra/docker/ai/Dockerfile
      target: production
    container_name: aat-ai-prod
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      ENVIRONMENT: production
      AI_DEVICE: ${AI_DEVICE:-cpu}
    volumes:
      - ai_prod_models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks:
      - aat-prod-network

  # ---------------------------------------------------------------------------
  # Frontend Web App (Next.js Standalone Production)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      target: production
    container_name: aat-web-prod
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_AI_SERVICE_URL: /ai/v1
      NEXT_PUBLIC_WS_URL: ws://${DOMAIN_NAME:-localhost}/api/v1/ws/learning
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aat-prod-network

  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy (Production Gateway)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: aat-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
      ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - aat-prod-network

volumes:
  postgres_prod_data:
  redis_prod_data:
  ai_prod_models:

networks:
  aat-prod-network:
    driver: bridge
