# =============================================================================
# Attention-Aware Timeline - Docker Compose (Production)
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aat-network

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aat-network

  api:
    build:
      context: .
      dockerfile: infra/docker/api/Dockerfile
      target: production
    restart: always
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      API_RELOAD: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aat-network

  ai:
    build:
      context: .
      dockerfile: infra/docker/ai/Dockerfile
      target: production
    restart: always
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - aat-network

  web:
    build:
      context: .
      dockerfile: infra/docker/web/Dockerfile
      target: production
    restart: always
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      - api
      - ai
    networks:
      - aat-network

  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/docker/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
      - ai
    networks:
      - aat-network

volumes:
  postgres_data:
  redis_data:

networks:
  aat-network:
    driver: bridge
